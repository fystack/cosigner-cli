name: CLI CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: make test
      - run: make dist
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get install -y dash shellcheck >/dev/null
      - run: scripts/test-installer.sh
      - name: Bootstrap cosign pin matches the cosign release
        run: scripts/check-cosign-pin.sh
